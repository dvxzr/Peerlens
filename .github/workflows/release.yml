# Push a tag like v0.2.0 → builds macOS and Linux packages, signs updater artifacts, writes the changelog
# and latest.json, and attaches everything to ONE draft release. Review the draft and publish it by hand;
# installed apps see the update only after it is published. Tests run once, next to the builds; if they
# fail, latest.json is not uploaded and the draft must not be published.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater signing key).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must match the app version
        run: python3 scripts/release.py check-version "$GITHUB_REF_NAME"
      - name: Signing key must be configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$KEY" || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (see README → Releasing)"; exit 1; }
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            python3 scripts/release.py notes "$TAG"
            echo
            echo "---"
            echo "Install: see the README. macOS builds are unsigned (System Settings → Privacy & Security → Open Anyway)."
            echo "Already installed? Settings → Updates → Check for updates."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Peerlens $TAG" --notes-file notes.md
          echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: dev # warm cache from CI on main
          save-if: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-target: x86_64-apple-darwin
          # Oldest supported Ubuntu with webkit2gtk-4.1, so the AppImage runs on more distros (glibc).
          - os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # latest.json is written once by the job below, so parallel builds can't overwrite each other.
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  updater-manifest:
    needs: [create-release, build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py self-test
          mkdir sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          ls sigs
          python3 scripts/release.py notes "$TAG" > notes.md
          python3 scripts/release.py latest-json --tag "$TAG" --repo "$GITHUB_REPOSITORY" --sigs sigs --notes notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
