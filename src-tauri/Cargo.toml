[package]
name = "peerlens"
version = "0.4.0"
edition = "2021"
description = "Desktop app for reviewing GitLab merge requests with a local, read-only AI agent"
license = "MIT"
rust-version = "1.82"

[lib]
name = "peerlens_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
thiserror = "2"
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
dirs = "6"
# Repo context: unpack the GitLab archive in-process (pure Rust, no `tar` subprocess).
flate2 = "1"
tar = { version = "0.4", default-features = false }
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s" # benchmarked vs 3: 3.9 MB vs 4.9 MB binary, diff parse 8.4 vs 7.9 ms per 200k lines
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
